<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14171C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily 1%">
<title>Thurein Lwin — Daily 1%</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314171C'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23E8A33D' stroke-width='3'/%3E%3Ctext x='32' y='39' font-family='Arial' font-size='18' font-weight='bold' fill='%23E8A33D' text-anchor='middle'%3E1%25%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">1%</span>
      <div class="brand-text">
        <span class="brand-name">Daily 1%</span>
        <span class="brand-sub">သူရိန်လွင် — Thurein Lwin</span>
      </div>
    </div>
    <div class="topbar-date" id="topbarDate">—</div>
  </header>

  <main id="views">

    <!-- TODAY VIEW -->
    <section class="view" id="view-today">
      <div id="todayContent"></div>
    </section>

    <!-- CALENDAR VIEW -->
    <section class="view" id="view-calendar" hidden>
      <div class="cal-nav">
        <button class="icon-btn" id="calPrev" aria-label="Previous month">‹</button>
        <h2 id="calMonthLabel">Month</h2>
        <button class="icon-btn" id="calNext" aria-label="Next month">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="legend" id="calLegend"></div>
      <div id="calDayDetail"></div>
    </section>

    <!-- REVIEW VIEW -->
    <section class="view" id="view-review" hidden>
      <div class="segmented" id="reviewSegment">
        <button class="seg-btn active" data-mode="month">Monthly</button>
        <button class="seg-btn" data-mode="year">Yearly</button>
      </div>
      <div id="reviewContent"></div>
    </section>

    <!-- SETTINGS VIEW -->
    <section class="view" id="view-settings" hidden>
      <div id="settingsContent"></div>
    </section>

  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="today">
      <span class="tab-ic">●</span><span>Today</span>
    </button>
    <button class="tab" data-view="calendar">
      <span class="tab-ic">▦</span><span>Calendar</span>
    </button>
    <button class="tab" data-view="review">
      <span class="tab-ic">◆</span><span>Review</span>
    </button>
    <button class="tab" data-view="settings">
      <span class="tab-ic">⚙</span><span>Settings</span>
    </button>
  </nav>

</div>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
